<!-- Version 2.1.0 - Fully Interactive Buttons & Services -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>فرصة فني</title>
  <meta name="theme-color" content="#0f172a">

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function(){
       emailjs.init("GmJXhbuFZa7wFxvn_");
    })();
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-24 select-none">

  <!-- Header -->
  <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800/80 p-4 sticky top-0 z-40">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-xl">🛠️</span>
        <h1 class="text-lg font-bold text-amber-500">فرصة فني</h1>
      </div>
      <span class="text-xs bg-slate-800 text-slate-400 border border-slate-700 px-2.5 py-1 rounded-full">القاهرة</span>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-md mx-auto w-full p-4 space-y-5">

    <!-- Admin Alert Banner -->
    <div id="statusAlert" class="hidden p-4 rounded-2xl text-center font-bold text-xs shadow-xl transition-all"></div>

    <!-- Home View (Services Grid) -->
    <div id="homeView" class="space-y-4">
      
      <div class="flex justify-between items-center">
        <h2 class="text-xs font-bold text-slate-400">اختر الخدمة المطلوبة:</h2>
      </div>

      <!-- Services Grid with Click Handlers -->
      <div class="grid grid-cols-2 gap-3">
        <button onclick="openServiceRequest('كهرباء', '⚡')" class="bg-slate-900 border border-slate-800/80 p-5 rounded-2xl flex flex-col items-center justify-center gap-2 hover:border-amber-500/50 active:scale-95 transition-all cursor-pointer">
          <span class="text-3xl">⚡</span>
          <span class="text-xs font-semibold text-slate-200">كهرباء</span>
        </button>
        
        <button onclick="openServiceRequest('سباكة', '🔧')" class="bg-slate-900 border border-slate-800/80 p-5 rounded-2xl flex flex-col items-center justify-center gap-2 hover:border-amber-500/50 active:scale-95 transition-all cursor-pointer">
          <span class="text-3xl">🔧</span>
          <span class="text-xs font-semibold text-slate-200">سباكة</span>
        </button>
        
        <button onclick="openServiceRequest('أجهزة منزلية', '📺')" class="bg-slate-900 border border-slate-800/80 p-5 rounded-2xl flex flex-col items-center justify-center gap-2 hover:border-amber-500/50 active:scale-95 transition-all cursor-pointer">
          <span class="text-3xl">📺</span>
          <span class="text-xs font-semibold text-slate-200">أجهزة منزلية</span>
        </button>
        
        <button onclick="openServiceRequest('تكييف', '❄️')" class="bg-slate-900 border border-slate-800/80 p-5 rounded-2xl flex flex-col items-center justify-center gap-2 hover:border-amber-500/50 active:scale-95 transition-all cursor-pointer">
          <span class="text-3xl">❄️</span>
          <span class="text-xs font-semibold text-slate-200">تكييف</span>
        </button>
        
        <button onclick="openServiceRequest('موبايلات', '📱')" class="bg-slate-900 border border-slate-800/80 p-5 rounded-2xl flex flex-col items-center justify-center gap-2 hover:border-amber-500/50 active:scale-95 transition-all cursor-pointer">
          <span class="text-3xl">📱</span>
          <span class="text-xs font-semibold text-slate-200">موبايلات</span>
        </button>
        
        <button onclick="openServiceRequest('سيارات', '🚗')" class="bg-slate-900 border border-slate-800/80 p-5 rounded-2xl flex flex-col items-center justify-center gap-2 hover:border-amber-500/50 active:scale-95 transition-all cursor-pointer">
          <span class="text-3xl">🚗</span>
          <span class="text-xs font-semibold text-slate-200">سيارات</span>
        </button>
        
        <button onclick="openServiceRequest('نقاشة', '🎨')" class="bg-slate-900 border border-slate-800/80 p-5 rounded-2xl flex flex-col items-center justify-center gap-2 hover:border-amber-500/50 active:scale-95 transition-all cursor-pointer">
          <span class="text-3xl">🎨</span>
          <span class="text-xs font-semibold text-slate-200">نقاشة</span>
        </button>
        
        <button onclick="openServiceRequest('نجارة', '🪚')" class="bg-slate-900 border border-slate-800/80 p-5 rounded-2xl flex flex-col items-center justify-center gap-2 hover:border-amber-500/50 active:scale-95 transition-all cursor-pointer">
          <span class="text-3xl">🪚</span>
          <span class="text-xs font-semibold text-slate-200">نجارة</span>
        </button>
        
        <button onclick="openServiceRequest('تنظيف', '🧹')" class="bg-slate-900 border border-slate-800/80 p-5 rounded-2xl flex flex-col items-center justify-center gap-2 hover:border-amber-500/50 active:scale-95 transition-all cursor-pointer">
          <span class="text-3xl">🧹</span>
          <span class="text-xs font-semibold text-slate-200">تنظيف</span>
        </button>
        
        <button onclick="openServiceRequest('نقل وشحن', '🚚')" class="bg-slate-900 border border-slate-800/80 p-5 rounded-2xl flex flex-col items-center justify-center gap-2 hover:border-amber-500/50 active:scale-95 transition-all cursor-pointer">
          <span class="text-3xl">🚚</span>
          <span class="text-xs font-semibold text-slate-200">نقل وشحن</span>
        </button>
      </div>

      <!-- Main Action Buttons -->
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button onclick="openJobForm()" class="bg-slate-900 border border-slate-800 hover:border-amber-500/50 text-slate-200 font-bold py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-95 transition-all cursor-pointer">
          <span>💼</span>
          <span>عايز شغل</span>
        </button>
        
        <button onclick="openGeneralRequest()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-4 rounded-2xl flex items-center justify-center gap-2 shadow-lg shadow-amber-500/10 active:scale-95 transition-all cursor-pointer">
          <span>🔧</span>
          <span>محتاج خدمة</span>
        </button>
      </div>

    </div>

    <!-- Job View (Application Form) -->
    <div id="jobView" class="hidden space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <button onclick="showView('homeView')" class="text-xs text-amber-400 font-bold flex items-center gap-1 cursor-pointer">
          <span>➡️</span> عودة للرئيسية
        </button>
        <h2 class="text-sm font-bold text-amber-500">استمارة التقديم كـ فني</h2>
      </div>

      <form id="jobForm" onsubmit="handleFormSubmit(event)" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">الاسم بالكامل</label>
          <input type="text" id="applicantName" required placeholder="مثال: محمد أحمد" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">رقم الهاتف / الواتساب</label>
          <input type="tel" id="applicantPhone" required placeholder="01234567890" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">التخصص / المهنة</label>
          <select id="jobTitle" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500">
            <option value="" disabled selected>اختر التخصص</option>
            <option value="كهربائي">كهربائي</option>
            <option value="سباك">سباك</option>
            <option value="فني تكييف">فني تكييف</option>
            <option value="نقاش">نقاش</option>
            <option value="نجار">نجار</option>
            <option value="تخصص آخر">تخصص آخر</option>
          </select>
        </div>

        <!-- ID Upload -->
        <div class="border-t border-slate-800 pt-4">
          <label class="block text-xs font-bold text-amber-400 mb-2">💳 توثيق الهوية (صورة البطاقة)</label>
          <div class="space-y-3">
            <div>
              <span class="block text-xs text-slate-400 mb-1">وجه البطاقة الأمامي:</span>
              <input type="file" id="idFrontInput" accept="image/*" required onchange="handleFileSelect(event, 'idFrontPreview')" class="w-full text-xs text-slate-400 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-amber-400 cursor-pointer">
              <img id="idFrontPreview" class="hidden mt-2 rounded-lg max-h-36 border border-slate-800 w-full object-cover">
            </div>
            <div>
              <span class="block text-xs text-slate-400 mb-1">ظهر البطاقة الخلفي:</span>
              <input type="file" id="idBackInput" accept="image/*" required onchange="handleFileSelect(event, 'idBackPreview')" class="w-full text-xs text-slate-400 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-amber-400 cursor-pointer">
              <img id="idBackPreview" class="hidden mt-2 rounded-lg max-h-36 border border-slate-800 w-full object-cover">
            </div>
          </div>
        </div>

        <!-- Camera Section -->
        <div class="border-t border-slate-800 pt-4">
          <label class="block text-xs font-bold text-amber-400 mb-2">📸 بصمة الوجه الحية (Live Selfie)</label>
          <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-center">
            <video id="webcam" autoplay playsinline class="hidden w-full h-44 bg-black rounded-lg mb-2 object-cover"></video>
            <canvas id="canvas" class="hidden"></canvas>
            <img id="selfiePreview" class="hidden w-full h-44 rounded-lg mb-2 border border-slate-800 object-cover">

            <div class="flex justify-center gap-2 mt-2">
              <button type="button" id="startCamBtn" onclick="startCamera()" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-amber-400 font-semibold text-xs px-4 py-2.5 rounded-xl border border-slate-700 transition-all cursor-pointer">
                📷 فتح الكاميرا
              </button>
              <button type="button" id="captureBtn" onclick="takeSelfie()" class="hidden bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-semibold text-xs px-4 py-2.5 rounded-xl transition-all cursor-pointer">
                ⚡ التقاط صورة الوجه
              </button>
            </div>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-95 transition-all text-slate-950 font-bold py-3.5 rounded-xl shadow-lg shadow-amber-500/20 mt-4 cursor-pointer">
          إرسال طلب الانضمام 🚀
        </button>
      </form>
    </div>

    <!-- Request Service Modal / View -->
    <div id="serviceModal" class="hidden space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <button onclick="showView('homeView')" class="text-xs text-amber-400 font-bold flex items-center gap-1 cursor-pointer">
          <span>➡️</span> رجوع
        </button>
        <h2 id="serviceModalTitle" class="text-sm font-bold text-amber-500">طلب خدمة</h2>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
        <div class="text-center p-3 bg-slate-950 rounded-xl border border-slate-800">
          <span id="serviceIcon" class="text-4xl block mb-1">🔧</span>
          <span id="serviceName" class="text-sm font-bold text-slate-200">اسم الخدمة</span>
        </div>

        <form onsubmit="handleServiceRequestSubmit(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">الاسم</label>
            <input type="text" required placeholder="اسمك الكريم" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">رقم الهاتف</label>
            <input type="tel" required placeholder="01XXXXXXXXX" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">وصف المشكلة / الطلب</label>
            <textarea rows="3" placeholder="اكتب تفاصيل الخدمة المطلوب تنفيذها..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500"></textarea>
          </div>
          <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg transition-all cursor-pointer">
            ارسال الطلب الآن 🛠️
          </button>
        </form>
      </div>
    </div>

    <!-- Orders View -->
    <div id="ordersView" class="hidden space-y-4">
      <h2 class="text-sm font-bold text-amber-500 border-b border-slate-800 pb-2">📋 طلباتي الأخيرة</h2>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center text-slate-400 text-xs">
        لا توجد طلبات نشطة حالياً.
      </div>
    </div>

    <!-- Messages View -->
    <div id="messagesView" class="hidden space-y-4">
      <h2 class="text-sm font-bold text-amber-500 border-b border-slate-800 pb-2">💬 المحادثات</h2>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center text-slate-400 text-xs">
        لا توجد محادثات مفتوحة.
      </div>
    </div>

    <!-- Profile View -->
    <div id="profileView" class="hidden space-y-4">
      <h2 class="text-sm font-bold text-amber-500 border-b border-slate-800 pb-2">👤 حسابي</h2>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3 text-xs">
        <div class="flex justify-between border-b border-slate-800 pb-2">
          <span class="text-slate-400">الحالة:</span>
          <span class="text-emerald-400 font-bold">نشط</span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-400">المدينة:</span>
          <span class="text-slate-200">القاهرة</span>
        </div>
      </div>
    </div>

  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800/80 py-2.5 z-40">
    <div class="max-w-md mx-auto flex justify-around items-center text-center">
      <button onclick="showView('homeView')" id="navHome" class="flex flex-col items-center gap-1 text-amber-500 font-semibold cursor-pointer">
        <span class="text-lg">🏫</span>
        <span class="text-[10px]">الرئيسية</span>
      </button>
      <button onclick="showView('ordersView')" id="navOrders" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 cursor-pointer">
        <span class="text-lg">📋</span>
        <span class="text-[10px]">طلباتي</span>
      </button>
      <button onclick="showView('messagesView')" id="navMessages" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 cursor-pointer">
        <span class="text-lg">💬</span>
        <span class="text-[10px]">المحادثات</span>
      </button>
      <button onclick="showView('profileView')" id="navProfile" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 cursor-pointer">
        <span class="text-lg">👤</span>
        <span class="text-[10px]">حسابي</span>
      </button>
    </div>
  </nav>

  <script>
    let idFrontBase64 = "";
    let idBackBase64 = "";
    let selfieBase64 = "";
    let videoStream = null;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) registration.unregister();
      });
    }

    function showView(viewId) {
      const views = ['homeView', 'jobView', 'serviceModal', 'ordersView', 'messagesView', 'profileView'];
      views.forEach(v => {
        const el = document.getElementById(v);
        if (el) el.classList.add('hidden');
      });

      document.getElementById(viewId).classList.remove('hidden');

      if (videoStream && viewId !== 'jobView') {
        videoStream.getTracks().forEach(track => track.stop());
      }
      window.scrollTo(0, 0);
    }

    function openJobForm() {
      showView('jobView');
    }

    function openServiceRequest(name, icon) {
      document.getElementById('serviceName').innerText = 'طلب خدمة ' + name;
      document.getElementById('serviceIcon').innerText = icon;
      showView('serviceModal');
    }

    function openGeneralRequest() {
      openServiceRequest('عامة', '🛠️');
    }

    function handleServiceRequestSubmit(e) {
      e.preventDefault();
      alert('✅ تم استلام طلبك بنجاح وسيتم التواصل معك قريباً!');
      showView('homeView');
    }

    function handleFileSelect(event, previewId) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Str = e.target.result;
        const imgEl = document.getElementById(previewId);
        imgEl.src = base64Str;
        imgEl.classList.remove('hidden');

        if (previewId === 'idFrontPreview') idFrontBase64 = base64Str;
        if (previewId === 'idBackPreview') idBackBase64 = base64Str;
      };
      reader.readAsDataURL(file);
    }

    async function startCamera() {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        const video = document.getElementById('webcam');
        video.srcObject = videoStream;
        video.classList.remove('hidden');
        document.getElementById('startCamBtn').classList.add('hidden');
        document.getElementById('captureBtn').classList.remove('hidden');
        document.getElementById('selfiePreview').classList.add('hidden');
      } catch (err) {
        alert('السماح بإذن الكاميرا مطلوب التقاط صورة الوجه.');
      }
    }

    function takeSelfie() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('canvas');
      const selfiePreview = document.getElementById('selfiePreview');

      canvas.width = video.videoWidth || 320;
      canvas.height = video.videoHeight || 240;
      const context = canvas.getContext('2d');
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      selfieBase64 = canvas.toDataURL('image/jpeg', 0.6);
      selfiePreview.src = selfieBase64;
      selfiePreview.classList.remove('hidden');
      video.classList.add('hidden');

      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }

      document.getElementById('startCamBtn').innerText = '🔄 إعادة التقاط الصورة';
      document.getElementById('startCamBtn').classList.remove('hidden');
      document.getElementById('captureBtn').classList.add('hidden');
    }

    function handleFormSubmit(event) {
      event.preventDefault();

      const btn = document.getElementById('submitBtn');
      const name = document.getElementById('applicantName').value.trim();
      const phone = document.getElementById('applicantPhone').value.trim();
      const jobTitle = document.getElementById('jobTitle').value;

      if (!idFrontBase64 || !idBackBase64) {
        alert('يرجى أرفاق صور البطاقة الشخصية.');
        return;
      }

      if (!selfieBase64) {
        alert('يرجى التقاط صورة الوجه الحية.');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'جاري إرسال الطلب... ⏳';

      const appId = Date.now();
      const baseUrl = 'https://hawea772-sudo.github.io/-forsa-fanny/';

      const templateParams = {
        applicant_name: name,
        applicant_phone: phone,
        job_title: jobTitle,
        accept_link: `${baseUrl}?action=accept&id=${appId}`,
        reject_link: `${baseUrl}?action=reject&id=${appId}`
      };

      emailjs.send('service_ofjx955', 'template_saoi5q6', templateParams)
        .then(function() {
           alert('✅ تم إرسال طلبك بنجاح وسنقوم بمراجعته!');
           document.getElementById('jobForm').reset();
           document.getElementById('idFrontPreview').classList.add('hidden');
           document.getElementById('idBackPreview').classList.add('hidden');
           document.getElementById('selfiePreview').classList.add('hidden');
           showView('homeView');
        }, function(error) {
           alert('❌ حدث خطأ أثناء الإرسال.');
        })
        .finally(function() {
           btn.disabled = false;
           btn.innerText = 'إرسال طلب الانضمام 🚀';
        });
    }

    // Process Admin Decision Links
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const action = urlParams.get('action');
      const appId = urlParams.get('id');
      const statusAlert = document.getElementById('statusAlert');

      if (action && appId) {
        if (action === 'accept') {
          localStorage.setItem(`app_status_${appId}`, 'accepted');
          statusAlert.className = 'p-4 rounded-2xl text-center font-bold text-xs bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
          statusAlert.innerHTML = `🎉 تم قبول الطلب رقم (#${appId}) بنجاح!`;
          statusAlert.classList.remove('hidden');
        } else if (action === 'reject') {
          localStorage.setItem(`app_status_${appId}`, 'rejected');
          statusAlert.className = 'p-4 rounded-2xl text-center font-bold text-xs bg-rose-500/20 text-rose-400 border border-rose-500/30';
          statusAlert.innerHTML = `🚫 تم رفض الطلب رقم (#${appId}).`;
          statusAlert.classList.remove('hidden');
        }
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    });
  </script>
</body>
</html>
