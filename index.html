<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فرصة فني - التقديم والتوظيف</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function(){
       emailjs.init("GmJXhbuFZa7wFxvn_");
    })();
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold text-amber-500">🛠️ فرصة فني</h1>
      <span class="text-xs bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-full border border-amber-500/20">منصة التوظيف</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto w-full p-4 flex-1">

    <!-- Admin Decision Alert Banner -->
    <div id="statusAlert" class="hidden mb-6 p-5 rounded-2xl text-center font-bold text-sm shadow-xl transition-all"></div>

    <!-- Application Card -->
    <div id="appContainer" class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-2xl">
      <h2 class="text-lg font-bold mb-1 text-white">طلب انضمام فني جديد</h2>
      <p class="text-slate-400 text-xs mb-6">يرجى استكمال كافة البيانات وصور التوثيق المطلوبة.</p>

      <form id="jobForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        
        <!-- Field 1: Name -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">الاسم الثلاثي</label>
          <input type="text" id="applicantName" required placeholder="مثال: أحمد محمود علي" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500 transition-all">
        </div>

        <!-- Field 2: Phone -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">رقم الهاتف / الواتساب</label>
          <input type="tel" id="applicantPhone" required placeholder="01xxxxxxxxx" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500 transition-all">
        </div>

        <!-- Field 3: Job Selection -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">المهنة / التخصص المطلوب</label>
          <select id="jobTitle" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500 transition-all">
            <option value="" disabled selected>اختر التخصص</option>
            <option value="كهربائي">كهربائي منازل/مصانع</option>
            <option value="سباك">سباك وصيانة شبكات</option>
            <option value="فني تكييف">فني تكييف وتبريد</option>
            <option value="نقاش">نقاش وديكورات</option>
            <option value="نجار">نجار تركيبات/صيانة</option>
            <option value="تخصص آخر">تخصص آخر</option>
          </select>
        </div>

        <!-- ID Upload Section -->
        <div class="border-t border-slate-700/80 pt-4 mt-2">
          <label class="block text-xs font-bold text-amber-400 mb-2">💳 توثيق الهوية (البطاقة الشخصية)</label>
          
          <div class="space-y-3">
            <div>
              <span class="block text-xs text-slate-400 mb-1">صورة وجه البطاقة (أمامي):</span>
              <input type="file" id="idFrontInput" accept="image/*" required onchange="handleFileSelect(event, 'idFrontPreview')" class="w-full text-xs text-slate-400 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-amber-400">
              <img id="idFrontPreview" class="hidden mt-2 rounded-lg max-h-32 border border-slate-700 w-full object-cover">
            </div>

            <div>
              <span class="block text-xs text-slate-400 mb-1">صورة ظهر البطاقة (خلفي):</span>
              <input type="file" id="idBackInput" accept="image/*" required onchange="handleFileSelect(event, 'idBackPreview')" class="w-full text-xs text-slate-400 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-amber-400">
              <img id="idBackPreview" class="hidden mt-2 rounded-lg max-h-32 border border-slate-700 w-full object-cover">
            </div>
          </div>
        </div>

        <!-- Camera / Selfie Section -->
        <div class="border-t border-slate-700/80 pt-4 mt-2">
          <label class="block text-xs font-bold text-amber-400 mb-2">📸 بصمة الوجه الحية (Live Selfie)</label>
          
          <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 text-center">
            <video id="webcam" autoplay playsinline class="hidden w-full h-44 bg-black rounded-lg mb-2 object-cover"></video>
            <canvas id="canvas" class="hidden"></canvas>
            <img id="selfiePreview" class="hidden w-full h-44 rounded-lg mb-2 border border-slate-700 object-cover">

            <div class="flex justify-center gap-2">
              <button type="button" id="startCamBtn" onclick="startCamera()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-3 py-2 rounded-lg transition-all">فتح الكاميرا 📷</button>
              <button type="button" id="captureBtn" onclick="takeSelfie()" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-lg transition-all">التقاط صورة الوجه ⚡</button>
            </div>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-95 transition-all text-slate-950 font-bold py-3.5 rounded-xl shadow-lg shadow-amber-500/20 mt-4">
          تأكيد وإرسال الطلب 🚀
        </button>
      </form>
    </div>

  </main>

  <footer class="text-center p-4 text-xs text-slate-500 border-t border-slate-800">
    تطبيق فرصة فني &copy; 2026
  </footer>

  <script>
    let idFrontBase64 = "";
    let idBackBase64 = "";
    let selfieBase64 = "";
    let videoStream = null;

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    function handleFileSelect(event, previewId) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Str = e.target.result;
        const imgEl = document.getElementById(previewId);
        imgEl.src = base64Str;
        imgEl.classList.remove('hidden');

        if (previewId === 'idFrontPreview') idFrontBase64 = base64Str;
        if (previewId === 'idBackPreview') idBackBase64 = base64Str;
      };
      reader.readAsDataURL(file);
    }

    async function startCamera() {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        const video = document.getElementById('webcam');
        video.srcObject = videoStream;
        video.classList.remove('hidden');
        document.getElementById('startCamBtn').classList.add('hidden');
        document.getElementById('captureBtn').classList.remove('hidden');
        document.getElementById('selfiePreview').classList.add('hidden');
      } catch (err) {
        alert('يرجى السماح بصلاحية الكاميرا لالتقاط صورة الوجه.');
      }
    }

    function takeSelfie() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('canvas');
      const selfiePreview = document.getElementById('selfiePreview');

      canvas.width = video.videoWidth || 320;
      canvas.height = video.videoHeight || 240;
      const context = canvas.getContext('2d');
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      selfieBase64 = canvas.toDataURL('image/jpeg', 0.6);
      selfiePreview.src = selfieBase64;
      selfiePreview.classList.remove('hidden');
      video.classList.add('hidden');

      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }

      document.getElementById('startCamBtn').innerText = 'إعادة التقاط الصورة 🔄';
      document.getElementById('startCamBtn').classList.remove('hidden');
      document.getElementById('captureBtn').classList.add('hidden');
    }

    function handleFormSubmit(event) {
      event.preventDefault();

      const btn = document.getElementById('submitBtn');
      const name = document.getElementById('applicantName').value.trim();
      const phone = document.getElementById('applicantPhone').value.trim();
      const jobTitle = document.getElementById('jobTitle').value;

      if (!idFrontBase64 || !idBackBase64) {
        alert('يرجى ارفاق صور البطاقة الشخصية.');
        return;
      }

      if (!selfieBase64) {
        alert('يرجى التقاط صورة الوجه الحية.');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'جاري إرسال الطلب... ⏳';

      const appId = Date.now();
      const baseUrl = 'https://hawea772-sudo.github.io/-forsa-fanny/';

      const templateParams = {
        applicant_name: name,
        applicant_phone: phone,
        job_title: jobTitle,
        accept_link: `${baseUrl}?action=accept&id=${appId}`,
        reject_link: `${baseUrl}?action=reject&id=${appId}`
      };

      emailjs.send('service_ofjx955', 'template_saoi5q6', templateParams)
        .then(function() {
           alert('✅ تم إرسال الطلب وتوثيق هويتك بنجاح!');
           document.getElementById('jobForm').reset();
           document.getElementById('idFrontPreview').classList.add('hidden');
           document.getElementById('idBackPreview').classList.add('hidden');
           document.getElementById('selfiePreview').classList.add('hidden');
        }, function(error) {
           alert('❌ حدث خطأ أثناء الإرسال.');
        })
        .finally(function() {
           btn.disabled = false;
           btn.innerText = 'تأكيد وإرسال الطلب 🚀';
        });
    }

    // Handle Direct Action Links inside the page
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const action = urlParams.get('action');
      const appId = urlParams.get('id');
      const statusAlert = document.getElementById('statusAlert');

      if (action && appId) {
        if (action === 'accept') {
          localStorage.setItem(`app_status_${appId}`, 'accepted');
          statusAlert.className = 'p-5 rounded-2xl text-center font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
          statusAlert.innerHTML = `🎉 تم قبول الطلب رقم (#${appId}) بنجاح!<br><span class="text-xs text-slate-300 font-normal">تم تحديث حالة الفني إلى مقبول.</span>`;
          statusAlert.classList.remove('hidden');
        } else if (action === 'reject') {
          localStorage.setItem(`app_status_${appId}`, 'rejected');
          statusAlert.className = 'p-5 rounded-2xl text-center font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30';
          statusAlert.innerHTML = `🚫 تم رفض الطلب رقم (#${appId}).<br><span class="text-xs text-slate-300 font-normal">تم تسجيل القرار في النظام.</span>`;
          statusAlert.classList.remove('hidden');
        }
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    });
  </script>
</body>
</html>
